      - entity: sensor.zendure_power_pv_total
        name: Total
        statistics:
          period: 5minute
          type: mean
          align: start
        type: area
        stroke_width: 2
        opacity: 0.35
        extend_to: now
        color: var(--accent-color)
        float_precision: 0
        yaxis_id: energy
        show:
          in_brush: true
          in_header: false
          in_legend: true
        color_threshold:
        - value: 0
          opacity: 0.1
        - value: 100
          opacity: 0.15
        - value: 200
          opacity: 0.25
        - value: 300
          opacity: 0.3
        - value: 400
          opacity: 0.35
        - value: 500
          opacity: 0.4
        - value: 600
          opacity: 0.45
        - value: 700
          opacity: 0.5
      - entity: sensor.zendure_power_pv_to_battery
        name: To Battery
        statistics:
          period: 5minute
          type: mean
          align: start
        type: area
        opacity: 0
        stroke_width: 0
        extend_to: now
        color: '#01a180'
        float_precision: 0
        yaxis_id: energy
        show:
          in_brush: true
          in_header: false
          in_legend: false
      - entity: sensor.zendure_power_pv_to_home
        name: To Home
        statistics:
          period: 5minute
          type: mean
          align: start
        type: area
        opacity: 0.35
        stroke_width: 0
        extend_to: now
        color: '#c0c0c2'
        float_precision: 0
        yaxis_id: energy
        show:
          in_brush: true
          in_header: false
          in_legend: false
      apex_config:
        tooltip:
          x:
            format: HH:mm
            show: false
        xaxis:
          labels:
            show: false
            style:
              colors: grey
          axisTicks:
            show: false
          axisBorder:
            color: color-mix(in srgb, var(--divider-color) 50%, transparent)
