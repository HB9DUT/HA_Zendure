- type: sections
  max_columns: 3
  path: geschiedenis
  title: History
  icon: mdi:history
  sections:
  - type: grid
    cards:
    - type: heading
      icon: ''
      heading_style: title
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_power
        tap_action:
          action: more-info
        color: '#01a180'
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_total_state_of_charge
        color: '#01a180'
        tap_action:
          action: more-info
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_relay_switches_today
        icon: mdi:swap-vertical-bold
        color: '#01a180'
        tap_action:
          action: more-info
      heading: Battery (7 days)
    - type: vertical-stack
      cards:
      - type: custom:apexcharts-card
        experimental:
          hidden_by_default: true
          color_threshold: true
          brush: true
        brush:
          selection_span: 1d
          apex_config:
            grid:
              strokeDashArray: 0
              borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
              show: true
            yaxis:
              show: false
            xaxis:
              labels:
                show: false
              axisTicks:
                show: false
              axisBorder:
                color: color-mix(in srgb, var(--divider-color) 50%, transparent)
            chart:
              height: 100
        cache: true
        update_interval: 15min
        stacked: true
        header:
          show: true
          show_states: true
          title: ''
        graph_span: 8d
        span:
          offset: -7d
          start: day
        series:
        - entity: sensor.zendure_power
          name: Battery
          statistics:
            period: 5minute
            type: mean
            align: start
          type: area
          transform: return -x;
          stroke_width: 2
          opacity: 0.35
          extend_to: now
          color: '#01a180'
          float_precision: 0
          color_threshold:
          - value: -2000
            opacity: 0.5
          - value: -1750
            opacity: 0.45
          - value: -1500
            opacity: 0.4
          - value: -1250
            opacity: 0.35
          - value: -1000
            opacity: 0.3
          - value: -750
            opacity: 0.25
          - value: -500
            opacity: 0.15
          - value: 0
            opacity: 0.1
          - value: 500
            opacity: 0.15
          - value: 750
            opacity: 0.25
          - value: 1000
            opacity: 0.3
          - value: 1250
            opacity: 0.35
          - value: 1500
            opacity: 0.4
          - value: 1750
            opacity: 0.45
          - value: 2000
            opacity: 0.5
          yaxis_id: energy
          show:
            in_brush: true
            in_header: false
            in_legend: false
        - entity: sensor.zendure_home_energy_meter_target
          name: Home Energy Meter
          statistics:
            period: 5minute
            type: mean
            align: start
          type: area
          stroke_width: 0
          opacity: 0.3
          extend_to: now
          color: '#c0c0c2'
          float_precision: 0
          yaxis_id: energy
          show:
            in_brush: true
            in_header: false
            in_legend: false
        - entity: sensor.zendure_total_state_of_charge
          name: State Of Charge
          statistics:
            period: 5minute
            type: max
            align: start
          type: line
          curve: smooth
          stroke_width: 0
          opacity: 1
          extend_to: now
          color: var(--accent-color)
          float_precision: 0
          yaxis_id: percentage
          show:
            in_header: false
            in_legend: false
        apex_config:
          tooltip:
            x:
              format: dd-MM (HH:mm)
              show: false
          xaxis:
            labels:
              show: false
              style:
                colors: grey
            axisTicks:
              show: false
            axisBorder:
              color: color-mix(in srgb, var(--divider-color) 50%, transparent)
          yaxis:
          - title:
              text: ''
            decimalsInFloat: 0
            labels:
              style:
                colors: color-mix(in srgb, var(--primary-text-color) 75%, transparent)
          grid:
            strokeDashArray: 0
            borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
            show: true
          chart:
            height: 300px
            zoom:
              autoScaleYaxis: true
          legend:
            show: false
            floating: true
            horizontalAlign: left
            offsetX: 25
            offsetY: 17
            formatter: |
              EVAL:function(seriesName, opts) {
                // filter series die niet in de legenda moeten
                if(seriesName === "leeg" || seriesName === "P1 (NOM Doel)") return "";
                return seriesName;
              }
          markers:
            size: 0
            hover:
              size: 0
      grid_options:
        columns: 36
        rows: auto
    - type: heading
      icon: ''
      heading: Inverter Temperature (7 days)
      heading_style: title
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_inverter_temperature
        color: '#01a180'
        tap_action:
          action: more-info
    - type: vertical-stack
      cards:
      - type: custom:apexcharts-card
        experimental:
          hidden_by_default: true
          color_threshold: true
          brush: true
        brush:
          selection_span: 1d
          apex_config:
            grid:
              strokeDashArray: 0
              borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
              show: true
            yaxis:
              show: false
              min: 0
              max: 80
              tickAmount: 0
            xaxis:
              labels:
                show: false
              axisTicks:
                show: false
              axisBorder:
                color: color-mix(in srgb, var(--divider-color) 50%, transparent)
            chart:
              height: 100
        header:
          show: true
          title: ''
        graph_span: 8day
        span:
          offset: -7d
          start: day
        stacked: true
        cache: false
        apex_config:
          markers:
            size: 0
            hover:
              size: 0
          annotations:
            yaxis:
            - y: 55
              borderColor: var(--accent-color)
              strokeDashArray: 4
              borderWidth: 2
          yaxis:
          - decimalsInFloat: 0
            min: 0
            max: 80
            tickAmount: 4
            labels:
              show: true
              style:
                colors: color-mix(in srgb, var(--primary-text-color) 75%, transparent)
          tooltip:
            x:
              format: dd-MM (HH:mm)
              show: false
          grid:
            show: true
            borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
            strokeDashArray: 0
            padding:
              top: -10
          chart:
            height: 200px
          legend:
            show: false
          xaxis:
            labels:
              show: false
            axisTicks:
              show: false
            axisBorder:
              color: color-mix(in srgb, var(--divider-color) 50%, transparent)
        series:
        - entity: sensor.zendure_inverter_temperature
          name: Inverter Temperature
          stroke_width: 2
          opacity: 0.2
          curve: smooth
          extend_to: now
          statistics:
            period: 5minute
            type: max
            align: start
          type: area
          color: '#01a180'
          show:
            in_header: false
            in_brush: true
          color_threshold:
          - value: 0
            opacity: 0.2
          - value: 30
            opacity: 0.35
          - value: 40
            opacity: 0.5
          - value: 50
            opacity: 0.65
          - value: 60
            opacity: 0.8
        - entity: sensor.zendure_power
          name: Battery
          transform: return Math.abs(x)
          statistics:
            period: 5minute
            type: max
            align: start
          type: line
          curve: smooth
          stroke_width: 0
          opacity: 1
          extend_to: now
          color: var(--accent-color)
          float_precision: 0
          yaxis_id: percentage
          show:
            in_header: false
            in_legend: false
      grid_options:
        columns: 36
        rows: auto
    column_span: 3
  cards: []
- type: sections
  max_columns: 4
  title: Settings
  path: configuratie
  icon: mdi:cog
  sections:
  - type: grid
    cards:
    - type: heading
      icon: ''
      heading: Connected Zendure
      heading_style: title
    - type: markdown
      text_only: true
      content: |-
        {% set product = states('sensor.zendure_product_model') %} {% set last = states.sensor.zendure_power.last_reported %}
        {% set base = 'https://cdn.jsdelivr.net/gh/Gielz1986/Zendure-HA-zenSDK@main/Devices/' %}
        {% set images = {
          'solarFlow2400AC': 'V2_SF_2400_AC.png',
          'solarFlow2400AC+': 'V2_SF_2400_AC_Plus_Pro.png',
          'Hyper2000': 'V2_Hyper_2000.png',
          'solarFlow2400Pro': 'V2_SF_2400_AC_Plus_Pro.png',
          'solarFlow1600AC+': 'V2_SF_1600_AC_Plus.png',
          'solarFlow800Pro': 'V2_SF_800_Pro.png',
          'solarFlow800Pro2': 'V2_SF_800_Pro.png',
          'solarFlow4000MixAC+': 'V2_SF_3000_4000_Mix.png',
          'solarFlow4000MixPro': 'V2_SF_3000_4000_Mix.png',
          'solarFlow3000MixAC+': 'V2_SF_3000_4000_Mix.png',
          'solarFlow800Plus': 'V2_SF_800_Plus.png'
        } %}
        {% if last in ['unknown', 'unavailable', '', None] %}
          {% set img = 'Inactive.png' %}
        {% else %}
          {% set diff = as_timestamp(now()) - as_timestamp(last) %}
          {% if diff >= 120 %}
            {% set img = 'Inactive.png' %}
          {% else %}
            {% set img = images.get(product, 'sf_2400_ac.png') %}
          {% endif %}
        {% endif %}
        <img src="{{ base ~ img }}">
      grid_options:
        columns: 3
        rows: auto
    - type: markdown
      content: |-
        {% set product = states('sensor.zendure_product_model') %}

        {% set names = {
          'solarFlow2400AC': 'Solarflow 2400 AC',
          'solarFlow2400AC+': 'Solarflow 2400 AC+',
          'solarFlow4000MixAC+': 'SolarFlow 4000 Mix AC+',
          'solarFlow4000MixPro': 'SolarFlow 4000 Mix Pro',
          'solarFlow3000MixAC+': 'SolarFlow 3000 Mix AC+',
          'solarFlow2400Pro': 'Solarflow 2400 Pro',
          'solarFlow1600AC+': 'Solarflow 1600 AC+',
          'Hyper2000': 'Hyper 2000',
          'solarFlow800Pro': 'Solarflow 800 Pro',
          'solarFlow800Pro2': 'Solarflow 800 Pro 2',
          'solarFlow800Plus': 'Solarflow 800 Plus'
        } %}

        **{{ names.get(product, 'Unknown') }}** ({{ states('sensor.zendure_total_capacity') }} kWh)
        {{ states('sensor.zendure_serial_number') }}

        {% set last = states.sensor.zendure_power.last_reported %}

        {% if last not in ['unknown', 'unavailable', '', None] %}
        {% set diff = as_timestamp(now()) - as_timestamp(last) %}

        **Last update from device**
        {% if diff > 120 %} Device Offline
        {% else %} {{ as_timestamp(last) | timestamp_custom('%Y-%m-%d %H:%M') }} (last update)
        {% endif %}

        {% else %}
        **Incorrect entities check package**
        {% endif %}
      grid_options:
        columns: 9
        rows: auto
    - type: heading
      icon: ''
      heading: Configuration (Basic)
      heading_style: title
      badges:
      - type: button
        icon: mdi:mouse
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.zendure_set_default_settings
          data: {}
          confirmation:
            title: Restore default settings ?
            text: Your current settings will be lost and replaced by the default settings. Are you sure?
            confirm_text: Restore
            dismiss_text: Cancel
        text: Default settings
        color: '#01a180'
    - type: entities
      entities:
      - entity: number.zendure_standby_delay
        name: Standby Delay
    - type: heading
      icon: ''
      heading: Configuration (Charging)
      heading_style: title
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_inverter_max_charge_power
        icon: mdi:api
        color: '#01a180'
        tap_action:
          action: more-info
    - type: entities
      entities:
      - entity: number.zendure_maximum_charge_power
        name: Max. Charge Power
      - entity: number.zendure_start_charging_at
        name: Start Charging At
      - entity: number.zendure_charge_buffer
        name: Charge Buffer
    - type: heading
      icon: ''
      heading: Configuration (Discharging)
      heading_style: title
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_inverter_max_discharge_power
        color: '#01a180'
        icon: mdi:api
        tap_action:
          action: more-info
    - type: entities
      entities:
      - entity: number.zendure_maximum_discharge_power
        name: Max Discharge Power
      - entity: number.zendure_start_discharging_at
        name: Start Discharge At
      - entity: number.zendure_discharge_buffer
        name: Discharge Buffer
  - type: grid
    cards:
    - type: heading
      icon: ''
      heading: Configuration (State Of Charge)
      heading_style: title
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_minimum_state_of_charge
        icon: mdi:api
        color: '#01a180'
        tap_action:
          action: more-info
      - type: entity
        show_state: true
        show_icon: false
        entity: sensor.zendure_maximum_state_of_charge
        icon: mdi:api
        color: '#01a180'
        tap_action:
          action: more-info
    - type: markdown
      content: <ha-alert alert-type="error">Warning</ha-alert>The minimum allowed state of charge is set below 10%. This is
        not recommended by Zendure.
      text_only: true
      visibility:
      - condition: numeric_state
        entity: sensor.zendure_minimum_state_of_charge
        below: 10
    - type: entities
      entities:
      - entity: switch.zendure_soc_protection_disabled
        name: SOC Protection Disabled
      - entity: number.zendure_minimum_allowed_state_of_charge
        name: Min. State Of Charge
      - entity: number.zendure_maximum_allowed_state_of_charge
        name: Max. State Of Charge
    - type: heading
      icon: ''
      heading: Configuration (PV)
      heading_style: title
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_pv_export_mode
        icon: mdi:api
        color: '#01a180'
        tap_action:
          action: more-info
      visibility:
      - condition: numeric_state
        entity: sensor.zendure_pv_import
        above: 0
    - type: entities
      entities:
      - entity: switch.zendure_pv_export_disabled
        name: PV Export Disabled
      visibility:
      - condition: numeric_state
        entity: sensor.zendure_pv_import
        above: 0
  - type: grid
    cards:
    - type: heading
      heading: Logbook (last 4 hours)
      heading_style: title
      badges:
      - type: button
        icon: mdi:information
        tap_action:
          action: navigate
          navigation_path: /logbook
        color: '#01a180'
        text: More
    - type: logbook
      target:
        entity_id:
        - select.zendure_operation_mode
      grid_options:
        columns: 12
        rows: 12
      hours_to_show: 4
  cards: []
  dense_section_placement: false
