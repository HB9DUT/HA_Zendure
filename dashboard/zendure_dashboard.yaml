        - min: 0
          title:
            text: ''
          decimalsInFloat: 0
          labels:
            style:
              colors: color-mix(in srgb, var(--primary-text-color) 75%, transparent)
        grid:
          strokeDashArray: 0
          borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
          show: true
        chart:
          height: 150px
        legend:
          show: true
          floating: true
          horizontalAlign: left
          offsetX: 25
          offsetY: 17
          formatter: |
            EVAL:function(seriesName, opts) {
              // filter series die niet in de legenda moeten
              if(seriesName === "To Battery" || seriesName === "To Home") return "";
              return seriesName;
            }
        markers:
          size: 0
          hover:
            size: 0
      visibility:
      - condition: numeric_state
        entity: sensor.zendure_pv_import
        above: 0
  - type: grid
    cards:
    - type: heading
      icon: ''
      heading_style: title
      heading: Control
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_home_energy_meter_power
        state_content: state
        color: '#01a180'
        icon: mdi:home
        tap_action:
          action: more-info
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.zendure_charging_mode
        name: Charging Mode
      - type: conditional
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity: sensor.zendure_charging_mode
            state: Standby
        row:
          entity: sensor.zendure_soc_limit_status
          name: SOC-limit Status
      - entity: sensor.zendure_indication_available_energy
        name: Available Energy
      - entity: sensor.zendure_indication_required_energy
        name: Required Energy
      - type: conditional
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity: sensor.zendure_charging_mode
            state: Discharging
        row:
          entity: sensor.zendure_indication_remaining_discharge_time
          name: Remaining Discharge Time
      - type: conditional
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity: sensor.zendure_charging_mode
            state: Charging
        row:
          entity: sensor.zendure_indication_remaining_charge_time
          name: Remaining Charge Time
      - type: conditional
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity: sensor.zendure_charging_mode
            state: Discharging
        row:
          entity: sensor.zendure_set_discharge_power
          name: Discharge Power
      - type: conditional
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity: sensor.zendure_charging_mode
            state: Charging
        row:
          entity: sensor.zendure_set_charge_power
          name: Charge Power
    - type: heading
      icon: ''
      heading: Zero Import
      heading_style: title
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_home_energy_zero_import_duration_today
        color: '#01a180'
        icon: mdi:leaf
        tap_action:
          action: more-info
        name: Today
        state_content:
        - name
        - state
    - type: custom:apexcharts-card
      experimental:
        hidden_by_default: true
      header:
        show: true
        title: ''
      graph_span: 2month
      span:
        start: month
        offset: -1month
      cache: false
      yaxis:
      - min: ~200
        apex_config:
          tickAmount: 4
          decimalsInFloat: 0
          labels:
            show: true
            style:
              colors: color-mix(in srgb, var(--primary-text-color) 75%, transparent)
      apex_config:
        yaxis:
          labels:
            show: true
            style:
              colors: color-mix(in srgb, var(--primary-text-color) 75%, transparent)
        tooltip:
          x:
            format: d/MM
            show: false
          y:
            formatter: |
              EVAL:function(value) {
                const h = Math.floor(value);
                const m = Math.round((value - h) * 60);
                return h + "h " + m + "m";
              }
        grid:
          show: true
          borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
          strokeDashArray: 0
          padding:
            top: -10
          row:
            opacity: 0.5
        chart:
          height: 150px
        legend:
          show: false
          floating: true
          horizontalAlign: left
          offsetX: 0
          offsetY: 17
        xaxis:
          labels:
            show: false
          axisTicks:
            show: false
          axisBorder:
            color: color-mix(in srgb, var(--divider-color) 50%, transparent)
      series:
      - entity: sensor.zendure_home_energy_zero_import_duration_today
        name: Zero Import
        statistics:
          period: day
          type: max
          align: start
        type: column
        color: '#01a180'
        show:
          in_header: false
          in_legend: false
    - type: heading
      icon: ''
      heading_style: title
      heading: Import | Export
      badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: sensor.zendure_rte_total
        name: RTE
        state_content:
        - name
        - state
        color: '#01a180'
        icon: mdi:percent
        tap_action:
          action: more-info
    - type: custom:apexcharts-card
      header:
        show: true
        title: ''
      graph_span: 24month
      span:
        start: month
        offset: -23month
      cache: false
      apex_config:
        yaxis:
        - decimalsInFloat: 0
          tickAmount: 4
          labels:
            show: true
            style:
              colors: color-mix(in srgb, var(--primary-text-color) 75%, transparent)
        tooltip:
          x:
            format: MM-yyyy
            show: false
        grid:
          show: true
          borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
          strokeDashArray: 0
          padding:
            top: -10
        chart:
          height: 150px
        legend:
          show: false
        xaxis:
          labels:
            show: false
          axisTicks:
            show: false
          axisBorder:
            color: color-mix(in srgb, var(--divider-color) 50%, transparent)
      series:
      - entity: sensor.zendure_energy_import
        name: Import
        statistics:
          period: month
          type: change
          align: start
        type: column
        color: '#01a180'
        show:
          in_header: false
      - entity: sensor.zendure_energy_export
        name: Export
        statistics:
          period: month
          type: change
          align: start
        type: column
        color: '#a2a2a3'
        show:
          in_header: false
    - type: entities
      entities:
      - entity: sensor.zendure_energy_import
        name: Import
      - entity: sensor.zendure_energy_export
        name: Export
  cards: []
  icon: mdi:battery
  dense_section_placement: false
- type: sections
  max_columns: 4
  icon: mdi:battery-heart-variant
  path: gezondheid
