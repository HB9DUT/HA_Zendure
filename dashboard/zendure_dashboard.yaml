          type: max
          align: start
        type: line
        curve: smooth
        stroke_width: 0
        opacity: 1
        extend_to: now
        color: var(--accent-color)
        float_precision: 0
        yaxis_id: percentage
        show:
          in_header: false
          in_legend: false
      apex_config:
        tooltip:
          x:
            format: HH:mm
            show: false
        xaxis:
          labels:
            show: false
            style:
              colors: grey
          axisTicks:
            show: false
          axisBorder:
            color: color-mix(in srgb, var(--divider-color) 50%, transparent)
        yaxis:
        - title:
            text: ''
          decimalsInFloat: 0
          labels:
            style:
              colors: color-mix(in srgb, var(--primary-text-color) 75%, transparent)
        grid:
          strokeDashArray: 0
          borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
          show: true
        chart:
          height: 204px
          toolbar:
            autoSelected: pan
            show: true
            tools:
              download: false
              zoom: true
              zoomin: false
              zoomout: false
              pan: true
          zoom:
            enabled: true
            allowMouseWheelZoom: true
            autoScaleYaxis: true
        legend:
          show: true
          floating: true
          horizontalAlign: left
          offsetX: 25
          offsetY: 17
          formatter: |
            EVAL:function(seriesName, opts) {
              // filter series die niet in de legenda moeten
              if(seriesName === "State Of Charge" || seriesName === "Leeg") return "";
              return seriesName;
            }
        markers:
          size: 0
          hover:
            size: 0
      visibility:
      - condition: state
        entity: select.zendure_operation_mode
        state: Manual
    - type: custom:apexcharts-card
      experimental:
        hidden_by_default: true
        color_threshold: true
      cache: false
      stacked: true
      update_interval: 5sec
      header:
        show: true
        show_states: true
        title: ''
      graph_span: 10min
      series:
      - entity: sensor.zendure_power
        name: Battery
        group_by:
          func: avg
          duration: 5sec
        type: area
        transform: return -x;
        offset: -5s
        stroke_width: 2
        opacity: 0.35
        extend_to: now
        color: '#01a180'
        float_precision: 0
        color_threshold:
        - value: -2000
          opacity: 0.5
        - value: -1750
          opacity: 0.45
        - value: -1500
          opacity: 0.4
        - value: -1250
          opacity: 0.35
        - value: -1000
          opacity: 0.3
        - value: -750
          opacity: 0.25
        - value: -500
          opacity: 0.15
        - value: 0
          opacity: 0.1
        - value: 500
          opacity: 0.15
        - value: 750
          opacity: 0.25
        - value: 1000
          opacity: 0.3
        - value: 1250
          opacity: 0.35
        - value: 1500
          opacity: 0.4
        - value: 1750
          opacity: 0.45
        - value: 2000
          opacity: 0.5
        yaxis_id: energy
        show:
          in_header: false
          in_legend: true
          offset_in_name: false
      - entity: sensor.zendure_home_energy_meter_target
        name: Home Energy Meter
        offset: -5s
        group_by:
          func: avg
          duration: 5sec
        type: area
        stroke_width: 0
        opacity: 0.3
        extend_to: now
        color: '#c0c0c2'
        float_precision: 0
        yaxis_id: energy
        show:
          in_header: false
          in_legend: true
          offset_in_name: false
      apex_config:
        toolbar:
          show: true
          tools:
            download: true
            selection: true
            zoom: true
            zoomin: true
            zoomout: true
            pan: true
        tooltip:
          x:
            format: HH:mm:ss
            show: false
        xaxis:
          labels:
            show: false
            style:
              colors: grey
          axisTicks:
            show: false
          axisBorder:
            color: color-mix(in srgb, var(--divider-color) 50%, transparent)
        yaxis:
        - title:
            text: ''
          decimalsInFloat: 0
          labels:
            style:
              colors: color-mix(in srgb, var(--primary-text-color) 75%, transparent)
        grid:
          strokeDashArray: 0
          borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
          show: true
          padding:
            top: -10
        chart:
          height: 150px
        legend:
          show: true
          floating: true
          horizontalAlign: left
          offsetX: 25
          offsetY: 17
          formatter: |
            EVAL:function(seriesName, opts) {
              // filter series die niet in de legenda moeten
              if(seriesName === "Leeg" || seriesName === "Leeg") return "";
              return seriesName;
            }
        markers:
          size: 0
          hover:
            size: 0
    - type: heading
      icon: ''
      heading: PV
      heading_style: title
      badges:
      - type: entity
        show_state: true
        show_icon: true
        color: var(--accent-color)
        entity: sensor.zendure_pv_passthrough
        tap_action:
          action: more-info
      - type: entity
        show_state: true
        show_icon: true
        color: var(--accent-color)
        entity: sensor.zendure_power_pv_to_battery
        icon: mdi:battery
        visibility:
        - condition: numeric_state
          entity: sensor.zendure_power_pv_to_battery
          above: 0
        tap_action:
          action: more-info
      - type: entity
        show_state: true
        show_icon: true
        color: var(--accent-color)
        entity: sensor.zendure_power_pv_to_home
        icon: mdi:home
        visibility:
        - condition: numeric_state
          entity: sensor.zendure_power_pv_to_home
          above: 0
        tap_action:
          action: more-info
      - type: entity
        show_state: true
        show_icon: true
        color: var(--accent-color)
        entity: sensor.zendure_pv_import_daily
        tap_action:
          action: more-info
      visibility:
      - condition: numeric_state
        entity: sensor.zendure_pv_import
        above: 0
    - type: custom:apexcharts-card
      experimental:
        hidden_by_default: true
        color_threshold: true
        brush: false
      brush:
        selection_span: 1d
        apex_config:
          grid:
            strokeDashArray: 0
            borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
            show: true
          yaxis:
            show: false
          xaxis:
            labels:
