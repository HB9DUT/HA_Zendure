          labels:
            show: true
            style:
              colors: color-mix(in srgb, var(--primary-text-color) 75%, transparent)
        tooltip:
          x:
            format: d/MM
            show: false
          y:
            formatter: |
              function(value, { seriesIndex, w }) {
                const name = w.globals.seriesNames[seriesIndex];
                if (name === "Geen kalibratie") {
                  return "";
                }
                return value;
